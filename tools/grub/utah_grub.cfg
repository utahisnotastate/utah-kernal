# Utah-OS GRUB menu — Ghost-Boot USB
set timeout=5
set default=0

menuentry "Utah-OS Reality Console (Aegis-Kernel)" {
    insmod fat
    insmod part_gpt
    chainloader /EFI/BOOT/BOOTX64.EFI
}

menuentry "Utah-OS (alternate path)" {
    chainloader /EFI/UtahOS/boot/BOOTX64.EFI
}

menuentry "Boot internal disk (Windows) — remove USB first" {
    echo Select your Windows boot entry from firmware (F12)
}
